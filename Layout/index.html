<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site</title>
    <link rel="icon" href="">
    <link rel="stylesheet" href="../CSS/index.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>

<body>

    <header>
        <nav class="container header-content" aria-label="Menu principal">
            <h1 class="logo"><img src="" alt=""
                    style="height:45px;vertical-align:middle;margin-right:8px;">Site</h1>
            <ul>
                <li><a href="#cardapio" title="Ver o cardápio completo">Cardápio</a></li>
                <li><a href="" target="_blank" title="Fale conosco pelo WhatsApp">Contato</a>
                </li>
                <li><a href="" target="_blank"
                        title="Ver localização no Google Maps">Localização</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <header class="overlay">
                <h2>Comida caseira e saborosa</h2>
                <p>Buffet, Porções e Drinks artesanais</p>
                <a href="#cardapio" class="btn">Ver Cardápio</a>
            </header>
        </section>

        <section class="cardapio" id="cardapio">
            <h2>Nosso Cardápio</h2>
            <nav class="cards" aria-label="Links do cardápio">
                <a href="cardapio.html?tab=buffet" class="card-link">
                    <article class="card">
                        <figure>
                            <img src="" alt="Buffet" />
                            <figcaption>
                                <h3>Buffet</h3>
                                <p></p>
                            </figcaption>
                        </figure>
                    </article>
                </a>
                <a href="cardapio.html?tab=porcoes" class="card-link">
                    <article class="card">
                        <figure>
                            <img src="" alt="Porções" />
                            <figcaption>
                                <h3>Porções</h3>
                                <p></p>
                            </figcaption>
                        </figure>
                    </article>
                </a>
                <a href="cardapio.html?tab=drinks" class="card-link">
                    <article class="card">
                        <figure>
                            <img src="" alt="Drinks" />
                            <figcaption>
                                <h3>Drinks</h3>
                                <p></p>
                            </figcaption>
                        </figure>
                    </article>
                </a>
            </nav>
        </section>

        <section class="info">
            <aside class="info-box">
                <h3>📍 Endereço</h3>
                <iframe
                    src=""
                    width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                <address></address>
            </aside>
            <aside class="info-box">
                <h3>⏰ Horários</h3>
                <p></p>
            </aside>
        </section>
    </main>

    <footer>
        <p>© 2025 Site</p>
        <nav class="social" aria-label="Redes sociais">
            <a href=""
                target="_blank" title="Acesse nosso Instagram"><img src="../Img/instagram_icon.png" alt="Instagram"
                    title="Instagram" /></a>
            <a href="" target="_blank" title="Fale conosco pelo WhatsApp"><img
                    src="../Img/WhatsApp-icone.png" alt="WhatsApp" title="WhatsApp" /></a>
        </nav>
    </footer>

</body>

</html>
